name: Deploy branch preview

on:
  push:
    branches-ignore:
      - master
      - main
      - gh-pages
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**.rb"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/broken-links.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  delete:

permissions:
  contents: write

jobs:
  deploy-preview:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Update _config.yml for preview ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": "/previews/${{ github.ref_name }}"
            }
      - name: Install and Build 🔧
        run: |
          pip3 install --upgrade jupyter
          ruby test/cache_bust_test.rb
          ruby test/repository_last_updated_test.rb
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy preview 🚀
        uses: JamesIves/github-pages-deploy-action@v4.6.4
        with:
          folder: _site
          branch: gh-pages
          target-folder: previews/${{ github.ref_name }}
          clean: true
          commit-message: Deploy preview for ${{ github.ref_name }}
      - name: Prepare canonical preview 404
        run: |
          mkdir _preview-404
          cp _site/404.html _preview-404/404.html
      - name: Deploy canonical preview 404
        uses: JamesIves/github-pages-deploy-action@v4.6.4
        with:
          folder: _preview-404
          branch: gh-pages
          clean: false
          commit-message: Deploy canonical 404 for ${{ github.ref_name }}
      - name: Summarize preview URL
        run: |
          echo "Preview URL: https://fanyangcs.github.io/previews/${{ github.ref_name }}/" >> "$GITHUB_STEP_SUMMARY"

  cleanup-preview:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
      - name: Remove orphaned branch previews 🧹
        run: |
          set -euo pipefail
          cd gh-pages

          live_branches=$(mktemp)
          trap 'rm -f "$live_branches"' EXIT
          while IFS=$'\t' read -r _ ref; do
            printf '%s\n' "${ref#refs/heads/}" >> "$live_branches"
          done < <(git ls-remote --heads origin)

          removed=0
          while IFS= read -r -d '' not_found; do
            preview_dir="${not_found%/404.html}"
            [ -f "${preview_dir}/index.html" ] || continue
            branch_name="${preview_dir#previews/}"
            if ! grep -Fqx -- "$branch_name" "$live_branches"; then
              echo "Removing orphaned preview for ${branch_name}."
              git rm -r --ignore-unmatch -- "$preview_dir"
              removed=1
            fi
          done < <(find previews -type f -name 404.html -print0)

          if (( removed == 0 )) || git diff --cached --quiet; then
            echo "No orphaned preview directories found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove orphaned branch previews"
          git push origin gh-pages
